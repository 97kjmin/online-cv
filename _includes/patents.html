<section class="section patents-section">
    <h2 class="section-title">
        <span class="fa-stack fa-xs">
            <i class="fas fa-circle fa-stack-2x"></i>
            <i class="fas fa-lightbulb fa-stack-1x fa-inverse"></i>
        </span>
        {{ site.data.data.patents.title }}
    </h2>

    <div class="intro">
        <p>{{ site.data.data.patents.intro }}</p>
    </div>

    <ul>
        {% for patent in site.data.data.patents.papers %}
        <li style="margin-bottom: 10px;">
            <span class="project-title">
                <a href="{{ patent.link }}" target="_blank" style="font-weight: normal; color: #2d7788;">{{ patent.title }}</a>
            </span>
            
            <div class="project-tagline" style="color: #777; font-size: 0.9em; margin-top: 2px;">
                {{ patent.conference }}
            </div>
        </li>
        {% endfor %}
    </ul>
</section>
